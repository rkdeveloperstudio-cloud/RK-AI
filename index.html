<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- No zoom, edge-to-edge, keyboard resizes the page content (app-like) -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

<meta name="theme-color" content="#101827">
<meta name="description" content="RK AI Mobile Business Assistant">
<meta name="format-detection" content="telephone=no">

<!-- Installed (home screen) app behaviour -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RK AI">

<link rel="manifest" href="./manifest.json">

<title>RK AI Mobile Assistant</title>

<style>
:root {
    --bg: #101827;
    --panel: #172235;
    --panel2: #202e43;
    --border: #293950;
    --text: #edf3fb;
    --muted: #94a3b8;
    --primary: #5688f5;
    --primary-hover: #3972ed;
    --success: #22c58b;
    --danger: #f87171;

    /* Set by JavaScript from window.visualViewport so the layout
       always matches the visible area (keyboard open or closed). */
    --app-height: 100dvh;
    --app-top: 0px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    /* Removes the double-tap-to-zoom delay and behaviour */
    touch-action: manipulation;
}

html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}

button,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
}

/* The app fills exactly the visible area, like a native app */
.app {
    position: fixed;
    top: var(--app-top);
    left: 0;
    right: 0;
    width: 100%;
    max-width: 950px;
    height: var(--app-height);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    min-width: 0;
    overflow: hidden;
}

/* HEADER */

.header {
    flex-shrink: 0;
    min-height: 76px;
    padding: 12px 18px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    padding-left: calc(18px + env(safe-area-inset-left, 0px));
    padding-right: calc(18px + env(safe-area-inset-right, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.logo {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    background: var(--primary);
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 19px;
    font-weight: 800;
    color: white;
}

.brand h1 {
    font-size: 17px;
    font-weight: 650;
}

.connection {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    background: var(--danger);
}

.dot.online {
    background: var(--success);
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-button {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    font-size: 19px;
}

/* CHAT */

.chat-area {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 24px 18px;
    padding-left: calc(18px + env(safe-area-inset-left, 0px));
    padding-right: calc(18px + env(safe-area-inset-right, 0px));
    overscroll-behavior: contain;
}

.welcome {
    max-width: 520px;
    margin: 50px auto 30px;
    text-align: center;
}

.welcome-logo {
    width: 70px;
    height: 70px;
    border-radius: 20px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto auto 20px;
    font-size: 25px;
    font-weight: 800;
}

.welcome h2 {
    font-size: 24px;
    margin-bottom: 12px;
}

.welcome p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 25px;
}

.suggestion {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    color: var(--text);
    font-size: 13px;
    text-align: left;
}

.suggestion:active {
    border-color: var(--primary);
    background: var(--panel2);
}

@media (hover: hover) {
    .suggestion:hover {
        border-color: var(--primary);
        background: var(--panel2);
    }
}

/* MESSAGES */

.message-row {
    display: flex;
    margin-bottom: 20px;
}

.message-row.user {
    justify-content: flex-end;
}

.message-row.assistant {
    justify-content: flex-start;
}

.message-bubble {
    max-width: 85%;
    padding: 14px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.65;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    /* Messages can still be selected and copied */
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
}

.user .message-bubble {
    background: var(--primary);
    color: white;
    border-bottom-right-radius: 4px;
}

.assistant .message-bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
}

.message-time {
    display: block;
    margin-top: 7px;
    font-size: 10px;
    opacity: 0.65;
    text-align: right;
}

.message-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
}

.typing {
    color: var(--muted);
    font-size: 13px;
    padding: 12px;
}

/* INPUT */

.input-section {
    flex-shrink: 0;
    padding: 14px 16px 10px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: calc(16px + env(safe-area-inset-left, 0px));
    padding-right: calc(16px + env(safe-area-inset-right, 0px));
    background: var(--panel);
    border-top: 1px solid var(--border);
}

/* Keyboard is open: no home-indicator gap, hide the footer line */
body.keyboard-open .input-section {
    padding-bottom: 10px;
}

body.keyboard-open .input-footer {
    display: none;
}

.input-container {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-width: 0;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px;
}

/* 16px minimum: anything smaller makes iPhones zoom the page when
   the box is tapped. This is the main cause of the zoom problem. */
.input-container textarea {
    flex: 1 1 0;
    width: 0;
    min-width: 0;
    max-height: 130px;
    resize: none;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    padding: 10px 7px;
    font-size: 16px;
    line-height: 1.4;
    -webkit-user-select: text;
    user-select: text;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 0;
}

.input-container textarea::placeholder {
    color: var(--muted);
}

/* VOICE LANGUAGE SELECTOR (16px so it never triggers zoom either) */

#voiceLanguage {
    flex: 0 0 96px;
    width: 96px;
    min-width: 96px;
    max-width: 96px;
    height: 43px;
    padding: 0 4px;
    color: var(--text);
    background-color: var(--panel2);
    border: 1px solid #475569;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    cursor: pointer;
}

#voiceLanguage:focus {
    border-color: var(--primary);
}

#voiceLanguage option {
    color: #edf3fb;
    background-color: #202e43;
}

/* While recording, the language box is replaced by Cancel */
.input-container.is-recording #voiceLanguage {
    display: none;
}

.cancel-recording-button {
    display: none;
    flex: 0 0 auto;
    height: 43px;
    padding: 0 12px;
    border: 1px solid var(--danger);
    border-radius: 10px;
    background: transparent;
    color: var(--danger);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
}

.input-container.is-recording .cancel-recording-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

/* BUTTONS */

.send-button,
.mic-button {
    width: 43px;
    height: 43px;
    min-width: 43px;
    flex: 0 0 43px;
    border: none;
    border-radius: 12px;
    font-size: 19px;
}

.send-button {
    background: var(--primary);
    color: white;
}

.send-button:active {
    background: var(--primary-hover);
}

.mic-button {
    background: transparent;
    color: var(--text);
}

.mic-button.recording {
    background: var(--danger);
    color: white;
    animation: pulse 1s infinite;
}

button:disabled,
select:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

@keyframes pulse {
    50% {
        opacity: 0.55;
    }
}

@media (prefers-reduced-motion: reduce) {
    .mic-button.recording {
        animation: none;
    }
}

/* FOOTER */

.input-footer {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 10px;
}

/* NOTIFICATION */

.toast {
    position: fixed;
    left: 50%;
    bottom: calc(100px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: #26374e;
    color: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 13px;
    display: none;
    z-index: 10000;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    display: block;
}

/* MOBILE */

@media (max-width: 600px) {

    .header {
        min-height: 68px;
        padding-top: calc(10px + env(safe-area-inset-top, 0px));
        padding-bottom: 10px;
    }

    .brand h1 {
        font-size: 15px;
    }

    .chat-area {
        padding-top: 18px;
        padding-bottom: 18px;
    }

    .welcome {
        margin-top: 35px;
    }

    .welcome h2 {
        font-size: 21px;
    }

    .suggestions {
        gap: 8px;
    }

    .suggestion {
        font-size: 12px;
        padding: 12px 9px;
    }

    .message-bubble {
        max-width: 90%;
    }

    .input-section {
        padding-top: 10px;
    }

    .input-container {
        gap: 5px;
        padding: 6px;
    }

    #voiceLanguage {
        flex: 0 0 90px;
        width: 90px;
        min-width: 90px;
        max-width: 90px;
    }

    .send-button,
    .mic-button {
        width: 40px;
        min-width: 40px;
        flex: 0 0 40px;
        height: 43px;
    }

    .input-footer {
        font-size: 9px;
    }
}

/* Short screens (landscape phones, keyboard open) */
@media (max-height: 560px) {
    .welcome {
        margin: 12px auto;
    }

    .welcome-logo,
    .welcome p {
        display: none;
    }

    .header {
        min-height: 56px;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <header class="header">

        <div class="brand">
            <div class="logo">RK</div>

            <div>
                <h1>RK AI Assistant</h1>

                <div class="connection" id="connectionStatus">
                    <span class="dot"></span>
                    Backend not connected
                </div>
            </div>
        </div>

        <div class="header-actions">
            <button class="icon-button"
                    id="clearButton"
                    type="button"
                    title="Clear chat"
                    aria-label="Clear chat">
                ↻
            </button>
        </div>

    </header>

    <main class="chat-area" id="chatArea">

        <section class="welcome" id="welcome">

            <div class="welcome-logo">RK</div>

            <h2>Welcome to RK AI</h2>

            <p>
                Your mobile business assistant.
                Ask questions about sales, purchases,
                inventory, suppliers and customers.
            </p>

            <div class="suggestions">

                <button class="suggestion"
                        type="button"
                        data-message="Check my today's total sales">
                    Today's total sales
                </button>

                <button class="suggestion"
                        type="button"
                        data-message="Show my current stock summary">
                    Current stock summary
                </button>

                <button class="suggestion"
                        type="button"
                        data-message="Show my top selling products">
                    Top selling products
                </button>

                <button class="suggestion"
                        type="button"
                        data-message="Show my purchase summary">
                    Purchase summary
                </button>

            </div>

        </section>

        <div id="messages"></div>

        <div id="typingIndicator" class="typing" hidden>
            RK AI is processing...
        </div>

    </main>

    <footer class="input-section">

        <div class="input-container" id="inputContainer">

            <textarea
                id="messageInput"
                placeholder="Ask your business assistant..."
                rows="1"
                maxlength="4000"
                enterkeyhint="send"
                autocomplete="off"
                autocapitalize="sentences"
                aria-label="Message"></textarea>

            <select id="voiceLanguage"
                    aria-label="Voice language"
                    title="Voice language">

                <option value="en">English</option>
                <option value="ml">മലയാളം</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>
                <option value="">Auto</option>

            </select>

            <button class="cancel-recording-button"
                    id="cancelRecordingButton"
                    type="button"
                    title="Discard this recording"
                    aria-label="Cancel and discard recording">
                Cancel
            </button>

            <button class="mic-button"
                    id="micButton"
                    type="button"
                    title="Start voice input"
                    aria-label="Start voice input">
                🎤
            </button>

            <button class="send-button"
                    id="sendButton"
                    type="button"
                    title="Send message"
                    aria-label="Send message">
                ➤
            </button>

        </div>

        <div class="input-footer">
            <span id="inputStatus">
                Type, or tap 🎤 to speak
            </span>

            <span>RK Developer Studio</span>
        </div>

    </footer>

</div>

<div class="toast"
     id="toast"
     role="status"
     aria-live="polite"></div>

<script>
"use strict";

/* =========================================
   CONFIGURATION
========================================= */

const CONFIG = {
    websocketUrl:
        "wss://rkai-mobile-assistant.rkdeveloperstudio.workers.dev/ws",

    mobileToken:
        "1b45eb76dbb603fcf7977245a57699f065851f1e2c23506e5d46458d48a0631b",

    transcriptionUrl:
        "https://rkai-mobile-assistant.rkdeveloperstudio.workers.dev/api/transcribe",

    demoMode: false
};

/* =========================================
   ELEMENTS
========================================= */

const rootElement = document.documentElement;
const chatArea = document.getElementById("chatArea");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const cancelRecordingButton =
    document.getElementById("cancelRecordingButton");
const inputContainer = document.getElementById("inputContainer");
const voiceLanguage = document.getElementById("voiceLanguage");
const connectionStatus = document.getElementById("connectionStatus");
const inputStatus = document.getElementById("inputStatus");
const typingIndicator = document.getElementById("typingIndicator");
const toast = document.getElementById("toast");

const IDLE_STATUS = "Type, or tap 🎤 to speak";

/* =========================================
   APPLICATION STATE
========================================= */

let socket = null;
const pendingRequests = new Map();
let isAuthenticated = false;
let officeOnline = false;
let authenticationFailed = false;
let reconnectTimer = null;
let toastTimer = null;

/* =========================================
   UTILITY FUNCTIONS
========================================= */

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = window.setTimeout(
        () => toast.classList.remove("show"),
        3200
    );
}

function getTime() {
    return new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });
}

function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
}

function createRequestId() {
    if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
    ) {
        return window.crypto.randomUUID();
    }
    return (
        "req-" +
        Date.now() +
        "-" +
        Math.random().toString(16).slice(2)
    );
}

function hasConfiguredToken() {
    return Boolean(
        CONFIG.mobileToken &&
            !CONFIG.mobileToken.startsWith("PASTE_")
    );
}

function updateInputHeight() {
    messageInput.style.height = "auto";
    messageInput.style.height =
        Math.min(messageInput.scrollHeight, 130) + "px";
}

function joinText(a, b) {
    const left = String(a || "").trim();
    const right = String(b || "").trim();
    return left && right ? left + " " + right : left || right;
}

/* =========================================
   APP-LIKE VIEWPORT (keyboard + zoom handling)
========================================= */

let baseViewportHeight = window.innerHeight;

function syncViewport() {
    const vv = window.visualViewport;
    const height = vv ? vv.height : window.innerHeight;
    const top = vv ? vv.offsetTop : 0;

    baseViewportHeight = Math.max(baseViewportHeight, height);

    rootElement.style.setProperty("--app-height", height + "px");
    rootElement.style.setProperty("--app-top", top + "px");

    document.body.classList.toggle(
        "keyboard-open",
        height < baseViewportHeight - 120
    );

    // iOS sometimes scrolls the whole page when the keyboard opens
    if (window.scrollX || window.scrollY) {
        window.scrollTo(0, 0);
    }

    if (document.activeElement === messageInput) {
        scrollToBottom();
    }
}

if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncViewport);
    window.visualViewport.addEventListener("scroll", syncViewport);
}

window.addEventListener("resize", syncViewport);

window.addEventListener("orientationchange", function () {
    window.setTimeout(function () {
        baseViewportHeight = window.visualViewport
            ? window.visualViewport.height
            : window.innerHeight;
        syncViewport();
    }, 400);
});

syncViewport();

messageInput.addEventListener("focus", function () {
    window.setTimeout(function () {
        syncViewport();
        scrollToBottom();
    }, 300);
});

/* =========================================
   CONNECTION STATUS
========================================= */

function setConnectionStatus(online, message) {
    connectionStatus.replaceChildren();
    const dot = document.createElement("span");
    dot.className = online ? "dot online" : "dot";
    connectionStatus.appendChild(dot);
    connectionStatus.appendChild(document.createTextNode(message));
}

/* =========================================
   MESSAGE DISPLAY
========================================= */

function addMessage(type, text) {
    welcome.style.display = "none";

    const row = document.createElement("div");
    row.className = "message-row " + type;

    const bubble = document.createElement("div");
    bubble.className = "message-bubble";

    const label = document.createElement("div");
    label.className = "message-label";
    label.textContent = type === "user" ? "You" : "RK AI";

    const content = document.createElement("div");
    content.textContent = String(text ?? "");

    const time = document.createElement("span");
    time.className = "message-time";
    time.textContent = getTime();

    bubble.appendChild(label);
    bubble.appendChild(content);
    bubble.appendChild(time);

    row.appendChild(bubble);
    messages.appendChild(row);

    scrollToBottom();
    return row;
}

/* =========================================
   SEND MESSAGE
========================================= */

function sendMessage() {
    if (voiceMode) {
        showToast("Finish or cancel the voice input first.");
        return;
    }

    if (voiceBusy) {
        showToast("Please wait, transcribing your voice...");
        return;
    }

    const message = messageInput.value.trim();
    if (!message) return;

    addMessage("user", message);

    messageInput.value = "";
    messageInput.style.height = "auto";

    if (CONFIG.demoMode) {
        showDemoResponse(message);
        return;
    }

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        addMessage(
            "assistant",
            "The messaging server is not connected. Please try again when the connection is available."
        );
        return;
    }

    sendToBackend(message);
}

/* =========================================
   SEND TO OFFICE BACKEND
========================================= */

function sendToBackend(message) {
    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN ||
        !isAuthenticated
    ) {
        addMessage(
            "assistant",
            "The mobile connection is not authenticated yet. Please wait for the connection and try again."
        );
        return;
    }

    if (!officeOnline) {
        addMessage(
            "assistant",
            "The office application is currently offline. Open RK AI Business Assistant on the office PC and wait until it connects."
        );
        return;
    }

    const requestId = createRequestId();

    const payload = {
        type: "user_message",
        requestId,
        conversationId: "mobile-default",
        message,
        timestamp: new Date().toISOString()
    };

    try {
        pendingRequests.set(requestId, {
            message,
            time: Date.now()
        });

        socket.send(JSON.stringify(payload));

        typingIndicator.hidden = false;
        scrollToBottom();

        window.setTimeout(() => {
            if (pendingRequests.has(requestId)) {
                pendingRequests.delete(requestId);
                typingIndicator.hidden =
                    pendingRequests.size === 0;
                addMessage(
                    "assistant",
                    "The office assistant has not responded yet. Check the desktop connection and try again."
                );
            }
        }, 60000);
    } catch (error) {
        pendingRequests.delete(requestId);
        typingIndicator.hidden = pendingRequests.size === 0;
        addMessage(
            "assistant",
            "Unable to send your message. Please reconnect and try again."
        );
        console.error("Send message failed:", error);
    }
}

/* =========================================
   WEBSOCKET CONNECTION
========================================= */

function connectBackend() {
    if (CONFIG.demoMode) {
        setConnectionStatus(false, "Local preview mode");
        return;
    }

    if (
        !CONFIG.websocketUrl ||
        CONFIG.websocketUrl.includes("YOUR-WORKER")
    ) {
        setConnectionStatus(false, "Set Worker URL in CONFIG");
        return;
    }

    if (!hasConfiguredToken()) {
        setConnectionStatus(false, "Configure mobile token");
        return;
    }

    if (
        socket &&
        (socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING)
    ) {
        return;
    }

    try {
        authenticationFailed = false;
        isAuthenticated = false;
        officeOnline = false;

        setConnectionStatus(false, "Connecting...");

        socket = new WebSocket(CONFIG.websocketUrl);

        socket.onopen = function () {
            socket.send(
                JSON.stringify({
                    type: "authenticate",
                    role: "mobile",
                    token: CONFIG.mobileToken
                })
            );
            setConnectionStatus(false, "Authenticating...");
        };

        socket.onmessage = function (event) {
            try {
                const data = JSON.parse(event.data);
                handleBackendMessage(data);
            } catch (error) {
                console.error("Invalid server response:", error);
            }
        };

        socket.onerror = function (error) {
            console.error("WebSocket error:", error);
        };

        socket.onclose = function () {
            isAuthenticated = false;
            officeOnline = false;
            setConnectionStatus(false, "Disconnected");
            typingIndicator.hidden = true;
            pendingRequests.clear();

            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            if (
                !authenticationFailed &&
                !CONFIG.demoMode &&
                hasConfiguredToken()
            ) {
                reconnectTimer = window.setTimeout(
                    connectBackend,
                    5000
                );
            }
        };
    } catch (error) {
        console.error("Connection failed:", error);
        setConnectionStatus(false, "Connection failed");
    }
}

/* =========================================
   RECEIVE BACKEND RESPONSE
========================================= */

function handleBackendMessage(data) {
    if (!data || typeof data.type !== "string") return;

    switch (data.type) {
        case "authenticated":
            if (data.role !== "mobile") {
                authenticationFailed = true;
                setConnectionStatus(
                    false,
                    "Unexpected authentication role"
                );
                socket?.close();
                return;
            }
            isAuthenticated = true;
            setConnectionStatus(
                false,
                "Authenticated · checking office..."
            );
            showToast("Mobile authenticated with RK AI server");
            break;

        case "authentication_failed":
            authenticationFailed = true;
            isAuthenticated = false;
            officeOnline = false;
            setConnectionStatus(
                false,
                "Authentication failed — check token"
            );
            showToast("Mobile token rejected by server");
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }
            break;

        case "office_status":
            officeOnline = Boolean(data.online);
            if (isAuthenticated) {
                setConnectionStatus(
                    officeOnline,
                    officeOnline
                        ? "Connected · office online"
                        : "Connected · office offline"
                );
            }
            break;

        case "message_received":
            if (data.message) {
                console.info("Worker:", data.message);
            }
            break;

        case "assistant_response": {
            const requestId = data.requestId;
            if (requestId && pendingRequests.has(requestId)) {
                pendingRequests.delete(requestId);
                typingIndicator.hidden =
                    pendingRequests.size === 0;
                addMessage(
                    "assistant",
                    String(data.message || "")
                );
            }
            break;
        }

        case "assistant_error":
        case "office_unavailable":
        case "error": {
            if (data.requestId) {
                pendingRequests.delete(data.requestId);
            } else if (data.type === "office_unavailable") {
                pendingRequests.clear();
            }
            typingIndicator.hidden =
                pendingRequests.size === 0;
            addMessage(
                "assistant",
                String(
                    data.message ||
                        (data.type === "office_unavailable"
                            ? "The office application is unavailable."
                            : "The server could not process the request.")
                )
            );
            break;
        }

        case "delivery_status":
            console.info("Office delivery status:", data);
            break;

        default:
            console.info("Unhandled server message:", data);
            break;
    }
}

/* =========================================
   DEMO MODE
========================================= */

function showDemoResponse(message) {
    typingIndicator.hidden = false;
    scrollToBottom();

    window.setTimeout(() => {
        typingIndicator.hidden = true;
        addMessage(
            "assistant",
            "This is a local interface preview.\n\n" +
                "Your message was received by the browser:\n\n" +
                message +
                "\n\nThe Cloudflare messaging server and office VB.NET AI connection have not been configured yet."
        );
    }, 700);
}

/* =========================================
   VOICE INPUT
   1) Primary: the phone's own speech engine (Google / Apple),
      live text while you speak. Best for Malayalam, Hindi, Arabic.
   2) Fallback: record audio and send it to the Worker (Whisper)
      when the browser has no speech engine or it fails.
   The text is never auto-sent: check it, then press Send.
========================================= */

const VOICE = {
    maximumRecordingMs: 60000,
    minimumRecordingMs: 500,
    minimumAudioBytes: 4000,
    locales: {
        en: "en-IN",
        ml: "ml-IN",
        hi: "hi-IN",
        ar: "ar-AE"
    }
};

const LANGUAGE_STORAGE_KEY = "rkai.voiceLanguage";

let voiceMode = null;      // null | "speech" | "audio"
let voiceBusy = false;     // true while the Worker is transcribing

/* ---- language memory (defaults to English, not Auto) ---- */

(function restoreVoiceLanguage() {
    let saved = null;
    try {
        saved = localStorage.getItem(LANGUAGE_STORAGE_KEY);
    } catch (error) { /* storage unavailable */ }

    const allowed = Array.from(voiceLanguage.options).map(
        (option) => option.value
    );
    voiceLanguage.value =
        saved !== null && allowed.includes(saved) ? saved : "en";
})();

voiceLanguage.addEventListener("change", function () {
    try {
        localStorage.setItem(LANGUAGE_STORAGE_KEY, voiceLanguage.value);
    } catch (error) { /* storage unavailable */ }
});

function getRecognitionLanguage() {
    return (
        VOICE.locales[voiceLanguage.value] ||
        navigator.language ||
        "en-IN"
    );
}

/* ---- shared UI helpers ---- */

function setRecordingUI(mode) {
    inputContainer.classList.add("is-recording");
    micButton.classList.add("recording");
    micButton.textContent = "⏹";
    micButton.title = "Stop and keep text";
    micButton.setAttribute("aria-label", "Stop voice input");
    inputStatus.textContent =
        mode === "speech"
            ? "Listening... tap ⏹ to finish"
            : "Recording... tap ⏹ to finish";
}

function resetVoiceUI() {
    voiceMode = null;
    inputContainer.classList.remove("is-recording");
    micButton.classList.remove("recording");
    micButton.textContent = "🎤";
    micButton.title = "Start voice input";
    micButton.setAttribute("aria-label", "Start voice input");
    inputStatus.textContent = IDLE_STATUS;
}

function startVoice() {
    if (voiceMode || voiceBusy) return;

    const Recognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (Recognition) {
        startSpeechRecognition(Recognition);
    } else {
        startAudioRecording();
    }
}

function stopVoice() {
    if (voiceMode === "speech") {
        stopSpeechRecognition();
    } else if (voiceMode === "audio") {
        stopAudioRecording(false);
    }
}

function cancelVoice() {
    if (voiceMode === "speech") {
        speechCancelled = true;
        finishSpeech();
    } else if (voiceMode === "audio") {
        stopAudioRecording(true);
    }
}

/* =========================================
   PRIMARY: BROWSER SPEECH RECOGNITION
========================================= */

let recognition = null;
let speechBase = "";
let speechCommitted = "";
let speechSession = "";
let speechGotText = false;
let speechStopRequested = false;
let speechCancelled = false;
let speechStartedAt = 0;
let speechQuickEnds = 0;
let speechMaxTimer = null;
let speechStopTimer = null;

function renderSpeechText(finals, interim) {
    const spoken = joinText(
        speechCommitted,
        joinText(finals, interim)
    );
    messageInput.value = joinText(speechBase, spoken);
    updateInputHeight();
}

function detachRecognition() {
    if (!recognition) return;

    recognition.onresult = null;
    recognition.onerror = null;
    recognition.onend = null;

    try {
        recognition.abort();
    } catch (error) { /* already stopped */ }

    recognition = null;
}

function startSpeechRecognition(Recognition) {
    speechBase = messageInput.value.trim();
    speechCommitted = "";
    speechSession = "";
    speechGotText = false;
    speechStopRequested = false;
    speechCancelled = false;
    speechQuickEnds = 0;

    try {
        recognition = new Recognition();
        recognition.lang = getRecognitionLanguage();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onresult = function (event) {
            let finals = "";
            let interim = "";

            // Rebuild from the whole result list each time so text is
            // never duplicated (a known problem on Android Chrome).
            for (let i = 0; i < event.results.length; i++) {
                const result = event.results[i];
                const piece =
                    result[0] && result[0].transcript
                        ? result[0].transcript
                        : "";

                if (result.isFinal) {
                    finals += piece;
                } else {
                    interim += piece;
                }
            }

            if (finals || interim) speechGotText = true;

            speechSession = finals;
            renderSpeechText(finals, interim);
        };

        recognition.onerror = function (event) {
            const reason = event && event.error;
            console.warn("Speech recognition error:", reason);

            if (reason === "no-speech" || reason === "aborted") {
                return;
            }

            const engineProblem =
                reason === "not-allowed" ||
                reason === "service-not-allowed" ||
                reason === "network" ||
                reason === "language-not-supported" ||
                reason === "audio-capture";

            if (engineProblem && !speechGotText) {
                // Nothing recognised yet: switch to audio recording
                fallbackToAudio();
                return;
            }

            if (engineProblem) {
                showToast(
                    "Speech service stopped. Check the text and try again."
                );
                speechStopRequested = true;
            }
        };

        recognition.onend = function () {
            if (voiceMode !== "speech") return;

            speechCommitted = joinText(speechCommitted, speechSession);
            speechSession = "";

            if (speechStopRequested || speechCancelled) {
                finishSpeech();
                return;
            }

            // The engine stops itself after a pause. Restart it, but
            // give up if it keeps ending immediately.
            const lasted = Date.now() - speechStartedAt;
            speechQuickEnds = lasted < 1000 ? speechQuickEnds + 1 : 0;

            if (speechQuickEnds >= 3) {
                showToast("Speech engine stopped. Check the text.");
                finishSpeech();
                return;
            }

            try {
                speechStartedAt = Date.now();
                recognition.start();
            } catch (error) {
                finishSpeech();
            }
        };

        voiceMode = "speech";
        speechStartedAt = Date.now();
        recognition.start();

        setRecordingUI("speech");

        speechMaxTimer = window.setTimeout(function () {
            if (voiceMode === "speech") {
                showToast("Maximum recording time reached.");
                stopSpeechRecognition();
            }
        }, VOICE.maximumRecordingMs);
    } catch (error) {
        console.warn("Could not start speech recognition:", error);
        detachRecognition();
        resetVoiceUI();
        startAudioRecording();
    }
}

function stopSpeechRecognition() {
    if (voiceMode !== "speech") return;

    speechStopRequested = true;
    inputStatus.textContent = "Finishing...";

    try {
        recognition.stop();
    } catch (error) {
        finishSpeech();
        return;
    }

    // Safety net in case the browser never fires "end"
    speechStopTimer = window.setTimeout(finishSpeech, 2500);
}

function finishSpeech() {
    if (voiceMode !== "speech") return;

    if (speechMaxTimer) {
        clearTimeout(speechMaxTimer);
        speechMaxTimer = null;
    }

    if (speechStopTimer) {
        clearTimeout(speechStopTimer);
        speechStopTimer = null;
    }

    const combined = joinText(
        speechBase,
        joinText(speechCommitted, speechSession)
    );

    detachRecognition();
    resetVoiceUI();

    if (speechCancelled) {
        messageInput.value = speechBase;
        updateInputHeight();
        showToast("Voice input cancelled.");
        return;
    }

    messageInput.value = combined;
    updateInputHeight();

    if (speechGotText) {
        showToast("Check the text, then press Send.");
    } else {
        showToast("No speech heard. Please try again.");
    }
}

function fallbackToAudio() {
    if (voiceMode !== "speech") return;

    if (speechMaxTimer) {
        clearTimeout(speechMaxTimer);
        speechMaxTimer = null;
    }

    detachRecognition();
    resetVoiceUI();
    messageInput.value = speechBase;
    updateInputHeight();

    showToast("Using audio recording instead.");
    startAudioRecording();
}

/* =========================================
   FALLBACK: AUDIO RECORDING -> WORKER
========================================= */

// Groq Whisper accepts m4a but NOT mp4: relabel Safari's
// audio/mp4 as .m4a on the way out.
const MIME_TO_EXTENSION = {
    "audio/webm": "webm",
    "audio/mp4": "m4a",
    "audio/m4a": "m4a",
    "audio/x-m4a": "m4a",
    "audio/aac": "m4a",
    "audio/mp3": "mp3",
    "audio/mpeg": "mp3",
    "audio/mpga": "mpga",
    "audio/wav": "wav",
    "audio/x-wav": "wav",
    "audio/ogg": "ogg",
    "audio/flac": "flac"
};

function getAudioFileExtension(mimeType) {
    const mime = String(mimeType || "")
        .toLowerCase()
        .split(";")[0]
        .trim();

    return MIME_TO_EXTENSION[mime] || null;
}

let mediaRecorder = null;
let voiceStream = null;
let voiceChunks = [];
let audioBase = "";
let audioCancelled = false;
let audioStartedAt = 0;
let audioMaxTimer = null;

function releaseAudio() {
    if (audioMaxTimer) {
        clearTimeout(audioMaxTimer);
        audioMaxTimer = null;
    }

    if (voiceStream) {
        voiceStream.getTracks().forEach((track) => track.stop());
        voiceStream = null;
    }

    mediaRecorder = null;
    voiceChunks = [];
}

async function startAudioRecording() {
    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia ||
        !window.MediaRecorder
    ) {
        showToast(
            "Voice input is not supported here. Use the microphone on your keyboard instead."
        );
        return;
    }

    if (voiceMode || voiceBusy) return;

    voiceMode = "audio";
    audioBase = messageInput.value.trim();
    audioCancelled = false;
    voiceChunks = [];

    try {
        // Noise suppression / echo cancelling distort speech for the
        // recogniser, so they are off. Mono 16 kHz is what Whisper uses.
        voiceStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                channelCount: 1,
                sampleRate: 16000,
                echoCancellation: false,
                noiseSuppression: false,
                autoGainControl: true
            }
        });

        // The user may have cancelled while the permission prompt was open
        if (voiceMode !== "audio") {
            releaseAudio();
            return;
        }

        let mimeType = "";
        const candidates = [
            "audio/webm;codecs=opus",
            "audio/mp4",
            "audio/ogg;codecs=opus",
            "audio/m4a"
        ];

        for (const candidate of candidates) {
            if (MediaRecorder.isTypeSupported(candidate)) {
                mimeType = candidate;
                break;
            }
        }

        const recorderOptions = { audioBitsPerSecond: 128000 };
        if (mimeType) recorderOptions.mimeType = mimeType;

        const recorder = new MediaRecorder(voiceStream, recorderOptions);
        mediaRecorder = recorder;

        recorder.ondataavailable = function (event) {
            if (event.data && event.data.size > 0) {
                voiceChunks.push(event.data);
            }
        };

        recorder.onerror = function (event) {
            console.error("MediaRecorder error:", event.error || event);
            audioCancelled = true;
            showToast("Microphone recording failed.");
            try {
                if (recorder.state !== "inactive") recorder.stop();
            } catch (error) {
                releaseAudio();
                resetVoiceUI();
            }
        };

        recorder.onstop = async function () {
            // Capture everything BEFORE cleanup clears it
            const recordedType = recorder.mimeType || mimeType || "";
            const chunks = voiceChunks.slice();
            const cancelled = audioCancelled;
            const duration = Date.now() - audioStartedAt;
            const base = audioBase;

            releaseAudio();
            resetVoiceUI();

            if (cancelled) return;

            if (duration < VOICE.minimumRecordingMs) {
                showToast("Recording was too short. Please try again.");
                return;
            }

            const blob = new Blob(chunks, {
                type: recordedType || "application/octet-stream"
            });

            if (blob.size < VOICE.minimumAudioBytes) {
                showToast("No clear audio was captured. Please try again.");
                return;
            }

            await transcribeAudio(blob, recordedType, base);
        };

        audioStartedAt = Date.now();
        // No timeslice: one complete file, most reliable on iOS Safari
        recorder.start();

        setRecordingUI("audio");

        audioMaxTimer = window.setTimeout(function () {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                showToast("Maximum recording time reached.");
                stopAudioRecording(false);
            }
        }, VOICE.maximumRecordingMs);
    } catch (error) {
        console.error("Could not start microphone:", error);
        releaseAudio();
        resetVoiceUI();
        showToast(
            error && error.name === "NotAllowedError"
                ? "Microphone permission was denied. Allow microphone access in your browser settings."
                : "Unable to start the microphone. Check permissions and try again."
        );
    }
}

function stopAudioRecording(cancelled) {
    audioCancelled = Boolean(cancelled);

    if (!mediaRecorder) {
        releaseAudio();
        resetVoiceUI();
        return;
    }

    if (mediaRecorder.state === "inactive") {
        releaseAudio();
        resetVoiceUI();
        return;
    }

    inputStatus.textContent = cancelled
        ? "Cancelling..."
        : "Preparing audio...";

    try {
        mediaRecorder.stop();
    } catch (error) {
        console.error("Could not stop recording:", error);
        releaseAudio();
        resetVoiceUI();
    }

    if (cancelled) {
        showToast("Voice input cancelled.");
    }
}

async function transcribeAudio(audioBlob, recordedType, baseText) {
    if (!CONFIG.transcriptionUrl) {
        showToast("Transcription URL is missing from CONFIG.");
        return;
    }

    if (!hasConfiguredToken()) {
        showToast("Configure your mobile token before using voice input.");
        return;
    }

    let extension =
        getAudioFileExtension(audioBlob.type) ||
        getAudioFileExtension(recordedType);

    if (!extension) {
        extension = /mp4|m4a|aac/i.test(recordedType) ? "m4a" : "webm";
        console.warn("Unknown audio type, using", extension, recordedType);
    }

    voiceBusy = true;
    micButton.disabled = true;
    voiceLanguage.disabled = true;
    inputStatus.textContent = "Transcribing...";

    try {
        const formData = new FormData();

        const selectedLanguage = voiceLanguage.value;
        if (selectedLanguage) {
            formData.append("language", selectedLanguage);
        }

        // Worker expects the multipart field "file"
        formData.append("file", audioBlob, "voice." + extension);

        const response = await fetch(CONFIG.transcriptionUrl, {
            method: "POST",
            headers: {
                "X-Mobile-Token": CONFIG.mobileToken
            },
            body: formData
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
            const detail =
                (result && result.details) ||
                (result && result.error) ||
                (result && result.message);

            throw new Error(
                detail ||
                    "Transcription service returned HTTP " + response.status
            );
        }

        if (!result.success) {
            throw new Error(
                result.error || "Transcription was unsuccessful."
            );
        }

        const transcript = String(result.text || "").trim();

        if (!transcript) {
            throw new Error("No speech could be recognized. Please try again.");
        }

        if (result.language) {
            console.info("Detected speech language:", result.language);
        }

        // Put the text in the box for review. Never auto-send.
        messageInput.value = joinText(baseText, transcript);
        updateInputHeight();
        showToast("Check the text, then press Send.");
    } catch (error) {
        console.error("Voice transcription failed:", error);
        showToast(
            error.message || "Voice transcription failed. Please try again."
        );
    } finally {
        voiceBusy = false;
        micButton.disabled = false;
        voiceLanguage.disabled = false;
        inputStatus.textContent = IDLE_STATUS;
    }
}

/* =========================================
   VOICE BUTTONS
========================================= */

micButton.addEventListener("click", function () {
    if (voiceBusy) return;

    if (voiceMode) {
        stopVoice();
    } else {
        startVoice();
    }
});

cancelRecordingButton.addEventListener("click", cancelVoice);

/* =========================================
   BUTTON EVENTS
========================================= */

// Keep the keyboard open when tapping Send or the mic
[sendButton, micButton].forEach(function (button) {
    button.addEventListener("mousedown", function (event) {
        event.preventDefault();
    });
});

sendButton.addEventListener("click", function () {
    const keepKeyboard = document.activeElement === messageInput;
    sendMessage();
    if (keepKeyboard) messageInput.focus({ preventScroll: true });
});

messageInput.addEventListener("keydown", function (event) {
    if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
    ) {
        event.preventDefault();
        sendMessage();
    }
});

messageInput.addEventListener("input", updateInputHeight);

/* =========================================
   SUGGESTION BUTTONS
========================================= */

document.querySelectorAll(".suggestion").forEach((button) => {
    button.addEventListener("click", function () {
        if (voiceMode || voiceBusy) {
            showToast("Finish the voice input first.");
            return;
        }
        messageInput.value = this.dataset.message || "";
        updateInputHeight();
        sendMessage();
    });
});

/* =========================================
   CLEAR CHAT
========================================= */

document.getElementById("clearButton").addEventListener("click", function () {
    if (!confirm("Clear this conversation?")) return;
    messages.replaceChildren();
    welcome.style.display = "block";
    typingIndicator.hidden = true;
    pendingRequests.clear();
    messageInput.value = "";
    messageInput.style.height = "auto";
    showToast("Conversation cleared");
});

/* =========================================
   PAGE INITIALIZATION
========================================= */

function initializeApp() {
    syncViewport();

    if (CONFIG.demoMode) {
        setConnectionStatus(false, "Local preview mode");
        return;
    }
    connectBackend();
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeApp);
} else {
    initializeApp();
}

/* =========================================
   CLEANUP WHEN PAGE IS HIDDEN OR CLOSED
========================================= */

function abandonVoice() {
    if (voiceMode === "speech") {
        speechCancelled = true;
        finishSpeech();
    } else if (voiceMode === "audio") {
        stopAudioRecording(true);
    }
}

document.addEventListener("visibilitychange", function () {
    if (document.hidden) abandonVoice();
});

window.addEventListener("pagehide", function () {
    abandonVoice();
    releaseAudio();

    if (socket && socket.readyState === WebSocket.OPEN) {
        socket.close();
    }
});

/* =========================================
   PREVENT PAGE ZOOM (pinch and double-tap)
   Double-tap zoom is stopped by CSS touch-action and the
   viewport tag. The old "touchend" blocker is removed because it
   also swallowed legitimate taps on the input box.
========================================= */

["gesturestart", "gesturechange", "gestureend"].forEach(function (name) {
    document.addEventListener(
        name,
        function (event) {
            event.preventDefault();
        },
        { passive: false }
    );
});

document.addEventListener(
    "touchmove",
    function (event) {
        if (event.touches && event.touches.length > 1) {
            event.preventDefault();
        }
    },
    { passive: false }
);
</script>
