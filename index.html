<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#101827">
<meta name="description" content="RK AI Mobile Business Assistant">

<link rel="manifest" href="./manifest.json">

<title>RK AI Mobile Assistant</title>

<style>
:root {
    --bg: #101827;
    --panel: #172235;
    --panel2: #202e43;
    --border: #293950;
    --text: #edf3fb;
    --muted: #94a3b8;
    --primary: #5688f5;
    --primary-hover: #3972ed;
    --success: #22c58b;
    --danger: #f87171;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

html {
    touch-action: manipulation;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
}

button,
textarea,
select {
    font-family: inherit;
}

button,
select {
    touch-action: manipulation;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 950px;
    height: 100%;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    min-width: 0;
}

/* HEADER */

.header {
    flex-shrink: 0;
    min-height: 76px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.logo {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    background: var(--primary);
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 19px;
    font-weight: 800;
    color: white;
}

.brand h1 {
    font-size: 17px;
    font-weight: 650;
}

.connection {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    background: var(--danger);
}

.dot.online {
    background: var(--success);
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-button {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    font-size: 19px;
}

/* CHAT */

.chat-area {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 24px 18px;
    scroll-behavior: smooth;
    overscroll-behavior: contain;
}

.welcome {
    max-width: 520px;
    margin: 50px auto 30px;
    text-align: center;
}

.welcome-logo {
    width: 70px;
    height: 70px;
    border-radius: 20px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto auto 20px;
    font-size: 25px;
    font-weight: 800;
}

.welcome h2 {
    font-size: 24px;
    margin-bottom: 12px;
}

.welcome p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 25px;
}

.suggestion {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    color: var(--text);
    font-size: 13px;
    text-align: left;
}

.suggestion:hover {
    border-color: var(--primary);
    background: var(--panel2);
}

/* MESSAGES */

.message-row {
    display: flex;
    margin-bottom: 20px;
}

.message-row.user {
    justify-content: flex-end;
}

.message-row.assistant {
    justify-content: flex-start;
}

.message-bubble {
    max-width: 85%;
    padding: 14px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.65;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.user .message-bubble {
    background: var(--primary);
    color: white;
    border-bottom-right-radius: 4px;
}

.assistant .message-bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
}

.message-time {
    display: block;
    margin-top: 7px;
    font-size: 10px;
    opacity: 0.65;
    text-align: right;
}

.message-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
}

.typing {
    color: var(--muted);
    font-size: 13px;
    padding: 12px;
}

/* INPUT */

.input-section {
    flex-shrink: 0;
    padding: 14px 16px 10px;
    background: var(--panel);
    border-top: 1px solid var(--border);
}

.input-container {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    min-width: 0;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px;
}

.input-container textarea {
    flex: 1 1 0;
    width: 0;
    min-width: 0;
    max-height: 130px;
    resize: none;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    padding: 10px 7px;
    font-size: 14px;
    line-height: 1.5;
}

.input-container textarea::placeholder {
    color: var(--muted);
}

/* VOICE LANGUAGE SELECTOR */

#voiceLanguage {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;

    flex: 0 0 105px;
    width: 105px;
    min-width: 105px;
    max-width: 105px;

    height: 43px;
    min-height: 43px;

    padding: 0 7px;
    margin: 0;

    color: #edf3fb;
    background-color: #202e43;

    border: 1px solid #475569;
    border-radius: 10px;

    font-family: inherit;
    font-size: 12px;

    appearance: auto;
    -webkit-appearance: menulist;

    outline: none;
    cursor: pointer;
    flex-shrink: 0;
}

#voiceLanguage:focus {
    border-color: var(--primary);
}

#voiceLanguage option {
    color: #edf3fb;
    background-color: #202e43;
}

/* LIVE SPEECH PREVIEW / CANCEL */
.cancel-recording-button {
    display: none;
    min-height: 38px;
    padding: 0 10px;
    border: 1px solid var(--danger);
    border-radius: 10px;
    background: transparent;
    color: var(--danger);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}
.cancel-recording-button.visible {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

/* BUTTONS */

.send-button,
.mic-button {
    width: 43px;
    height: 43px;
    min-width: 43px;
    flex: 0 0 43px;
    border: none;
    border-radius: 12px;
    font-size: 19px;
}

.send-button {
    background: var(--primary);
    color: white;
}

.send-button:hover {
    background: var(--primary-hover);
}

.mic-button {
    background: transparent;
    color: var(--text);
}

.mic-button.recording {
    background: var(--danger);
    color: white;
    animation: pulse 1s infinite;
}

button:disabled,
select:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

@keyframes pulse {
    50% {
        opacity: 0.55;
    }
}

/* FOOTER */

.input-footer {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 10px;
}

/* NOTIFICATION */

.toast {
    position: fixed;
    left: 50%;
    bottom: 95px;
    transform: translateX(-50%);
    background: #26374e;
    color: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 13px;
    display: none;
    z-index: 10000;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    display: block;
}

/* MOBILE */

@media (max-width: 600px) {

    .header {
        min-height: 68px;
        padding: 10px 13px;
    }

    .brand h1 {
        font-size: 15px;
    }

    .chat-area {
        padding: 18px 12px;
    }

    .welcome {
        margin-top: 35px;
    }

    .welcome h2 {
        font-size: 21px;
    }

    .suggestions {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .suggestion {
        font-size: 12px;
        padding: 12px 9px;
    }

    .message-bubble {
        max-width: 90%;
        font-size: 14px;
    }

    .input-section {
        padding: 10px;
    }

    .input-container {
        gap: 5px;
        padding: 6px;
    }

    #voiceLanguage {
        flex: 0 0 88px;
        width: 88px;
        min-width: 88px;
        max-width: 88px;
        font-size: 11px;
        padding: 0 4px;
    }

    .send-button,
    .mic-button {
        width: 40px;
        min-width: 40px;
        flex: 0 0 40px;
        height: 43px;
    }

    .input-footer {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">
            <div class="logo">RK</div>

            <div>
                <h1>RK AI Assistant</h1>

                <div class="connection" id="connectionStatus">
                    <span class="dot"></span>
                    Backend not connected
                </div>
            </div>
        </div>

        <div class="header-actions">
            <button class="icon-button"
                    id="clearButton"
                    title="Clear chat"
                    aria-label="Clear chat">
                ↻
            </button>
        </div>

    </header>

    <main class="chat-area" id="chatArea">

        <section class="welcome" id="welcome">

            <div class="welcome-logo">RK</div>

            <h2>Welcome to RK AI</h2>

            <p>
                Your mobile business assistant.
                Ask questions about sales, purchases,
                inventory, suppliers and customers.
            </p>

            <div class="suggestions">

                <button class="suggestion"
                        data-message="Check my today's total sales">
                    Today's total sales
                </button>

                <button class="suggestion"
                        data-message="Show my current stock summary">
                    Current stock summary
                </button>

                <button class="suggestion"
                        data-message="Show my top selling products">
                    Top selling products
                </button>

                <button class="suggestion"
                        data-message="Show my purchase summary">
                    Purchase summary
                </button>

            </div>

        </section>

        <div id="messages"></div>

        <div id="typingIndicator" class="typing" hidden>
            RK AI is processing...
        </div>

    </main>

    <footer class="input-section">

        <div class="input-container">

            <textarea
                id="messageInput"
                placeholder="Ask your business assistant..."
                rows="1"
                maxlength="4000"
                aria-label="Message"></textarea>

            <select id="voiceLanguage"
                    aria-label="Voice transcription language"
                    title="Voice language">

                <option value="">Auto</option>
                <option value="en">English</option>
                <option value="ml">മലയാളം</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>

            </select>

            <button class="mic-button"
                    id="micButton"
                    title="Start voice recording"
                    aria-label="Start voice recording">
                🎤
            </button>

            <button class="cancel-recording-button"
                    id="cancelRecordingButton"
                    type="button"
                    title="Discard this recording"
                    aria-label="Cancel and discard recording">
                Cancel
            </button>

            <button class="send-button"
                    id="sendButton"
                    title="Send message"
                    aria-label="Send message">
                ➤
            </button>

        </div>

        <div class="input-footer">
            <span id="inputStatus">
                Text and multilingual voice supported
            </span>

            <span>RK Developer Studio</span>
        </div>

    </footer>

</div>

<div class="toast"
     id="toast"
     role="status"
     aria-live="polite"></div>

<script>
"use strict";

/* =========================================
   CONFIGURATION
========================================= */

const CONFIG = {
    websocketUrl:
        "wss://rkai-mobile-assistant.rkdeveloperstudio.workers.dev/ws",

    mobileToken:
        "1b45eb76dbb603fcf7977245a57699f065851f1e2c23506e5d46458d48a0631b",

    transcriptionUrl:
        "https://rkai-mobile-assistant.rkdeveloperstudio.workers.dev/api/transcribe",

    demoMode: false
};

/* =========================================
   ELEMENTS
========================================= */

const chatArea = document.getElementById("chatArea");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");
const cancelRecordingButton = document.getElementById("cancelRecordingButton");
const voiceLanguage = document.getElementById("voiceLanguage");
const connectionStatus = document.getElementById("connectionStatus");
const inputStatus = document.getElementById("inputStatus");
const typingIndicator = document.getElementById("typingIndicator");
const toast = document.getElementById("toast");

/* =========================================
   APPLICATION STATE
========================================= */

let socket = null;
const pendingRequests = new Map();
let isAuthenticated = false;
let officeOnline = false;
let authenticationFailed = false;
let reconnectTimer = null;

/* =========================================
   UTILITY FUNCTIONS
========================================= */

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    window.setTimeout(() => toast.classList.remove("show"), 3000);
}

function getTime() {
    return new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });
}

function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
}

function createRequestId() {
    if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
    ) {
        return window.crypto.randomUUID();
    }
    return (
        "req-" +
        Date.now() +
        "-" +
        Math.random().toString(16).slice(2)
    );
}

function hasConfiguredToken() {
    return Boolean(
        CONFIG.mobileToken &&
            !CONFIG.mobileToken.startsWith("PASTE_")
    );
}

function updateInputHeight() {
    messageInput.style.height = "auto";
    messageInput.style.height =
        Math.min(messageInput.scrollHeight, 130) + "px";
}

/* =========================================
   CONNECTION STATUS
========================================= */

function setConnectionStatus(online, message) {
    connectionStatus.replaceChildren();
    const dot = document.createElement("span");
    dot.className = online ? "dot online" : "dot";
    connectionStatus.appendChild(dot);
    connectionStatus.appendChild(document.createTextNode(message));
}

/* =========================================
   MESSAGE DISPLAY
========================================= */

function addMessage(type, text) {
    welcome.style.display = "none";

    const row = document.createElement("div");
    row.className = "message-row " + type;

    const bubble = document.createElement("div");
    bubble.className = "message-bubble";

    const label = document.createElement("div");
    label.className = "message-label";
    label.textContent = type === "user" ? "You" : "RK AI";

    const content = document.createElement("div");
    content.textContent = String(text ?? "");

    const time = document.createElement("span");
    time.className = "message-time";
    time.textContent = getTime();

    bubble.appendChild(label);
    bubble.appendChild(content);
    bubble.appendChild(time);

    row.appendChild(bubble);
    messages.appendChild(row);

    scrollToBottom();
    return row;
}

/* =========================================
   SEND MESSAGE
========================================= */

function sendMessage() {
    const message = messageInput.value.trim();
    if (!message) return;

    addMessage("user", message);

    messageInput.value = "";
    messageInput.style.height = "auto";

    if (CONFIG.demoMode) {
        showDemoResponse(message);
        return;
    }

    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ) {
        addMessage(
            "assistant",
            "The messaging server is not connected. Please try again when the connection is available."
        );
        return;
    }

    sendToBackend(message);
}

/* =========================================
   SEND TO OFFICE BACKEND
========================================= */

function sendToBackend(message) {
    if (
        !socket ||
        socket.readyState !== WebSocket.OPEN ||
        !isAuthenticated
    ) {
        addMessage(
            "assistant",
            "The mobile connection is not authenticated yet. Please wait for the connection and try again."
        );
        return;
    }

    if (!officeOnline) {
        addMessage(
            "assistant",
            "The office application is currently offline. Open RK AI Business Assistant on the office PC and wait until it connects."
        );
        return;
    }

    const requestId = createRequestId();

    const payload = {
        type: "user_message",
        requestId,
        conversationId: "mobile-default",
        message,
        timestamp: new Date().toISOString()
    };

    try {
        pendingRequests.set(requestId, {
            message,
            time: Date.now()
        });

        socket.send(JSON.stringify(payload));

        typingIndicator.hidden = false;
        scrollToBottom();

        window.setTimeout(() => {
            if (pendingRequests.has(requestId)) {
                pendingRequests.delete(requestId);
                typingIndicator.hidden =
                    pendingRequests.size === 0;
                addMessage(
                    "assistant",
                    "The office assistant has not responded yet. Check the desktop connection and try again."
                );
            }
        }, 60000);
    } catch (error) {
        pendingRequests.delete(requestId);
        typingIndicator.hidden = pendingRequests.size === 0;
        addMessage(
            "assistant",
            "Unable to send your message. Please reconnect and try again."
        );
        console.error("Send message failed:", error);
    }
}

/* =========================================
   WEBSOCKET CONNECTION
========================================= */

function connectBackend() {
    if (CONFIG.demoMode) {
        setConnectionStatus(false, "Local preview mode");
        return;
    }

    if (
        !CONFIG.websocketUrl ||
        CONFIG.websocketUrl.includes("YOUR-WORKER")
    ) {
        setConnectionStatus(false, "Set Worker URL in CONFIG");
        return;
    }

    if (!hasConfiguredToken()) {
        setConnectionStatus(false, "Configure mobile token");
        return;
    }

    if (
        socket &&
        (socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING)
    ) {
        return;
    }

    try {
        authenticationFailed = false;
        isAuthenticated = false;
        officeOnline = false;

        setConnectionStatus(false, "Connecting...");

        socket = new WebSocket(CONFIG.websocketUrl);

        socket.onopen = function () {
            socket.send(
                JSON.stringify({
                    type: "authenticate",
                    role: "mobile",
                    token: CONFIG.mobileToken
                })
            );
            setConnectionStatus(false, "Authenticating...");
        };

        socket.onmessage = function (event) {
            try {
                const data = JSON.parse(event.data);
                handleBackendMessage(data);
            } catch (error) {
                console.error("Invalid server response:", error);
            }
        };

        socket.onerror = function (error) {
            console.error("WebSocket error:", error);
        };

        socket.onclose = function () {
            isAuthenticated = false;
            officeOnline = false;
            setConnectionStatus(false, "Disconnected");
            typingIndicator.hidden = true;
            pendingRequests.clear();

            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            if (
                !authenticationFailed &&
                !CONFIG.demoMode &&
                hasConfiguredToken()
            ) {
                reconnectTimer = window.setTimeout(
                    connectBackend,
                    5000
                );
            }
        };
    } catch (error) {
        console.error("Connection failed:", error);
        setConnectionStatus(false, "Connection failed");
    }
}

/* =========================================
   RECEIVE BACKEND RESPONSE
========================================= */

function handleBackendMessage(data) {
    if (!data || typeof data.type !== "string") return;

    switch (data.type) {
        case "authenticated":
            if (data.role !== "mobile") {
                authenticationFailed = true;
                setConnectionStatus(
                    false,
                    "Unexpected authentication role"
                );
                socket?.close();
                return;
            }
            isAuthenticated = true;
            setConnectionStatus(
                false,
                "Authenticated · checking office..."
            );
            showToast("Mobile authenticated with RK AI server");
            break;

        case "authentication_failed":
            authenticationFailed = true;
            isAuthenticated = false;
            officeOnline = false;
            setConnectionStatus(
                false,
                "Authentication failed — check token"
            );
            showToast("Mobile token rejected by server");
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.close();
            }
            break;

        case "office_status":
            officeOnline = Boolean(data.online);
            if (isAuthenticated) {
                setConnectionStatus(
                    officeOnline,
                    officeOnline
                        ? "Connected · office online"
                        : "Connected · office offline"
                );
            }
            break;

        case "message_received":
            if (data.message) {
                console.info("Worker:", data.message);
            }
            break;

        case "assistant_response": {
            const requestId = data.requestId;
            if (requestId && pendingRequests.has(requestId)) {
                pendingRequests.delete(requestId);
                typingIndicator.hidden =
                    pendingRequests.size === 0;
                addMessage(
                    "assistant",
                    String(data.message || "")
                );
            }
            break;
        }

        case "assistant_error":
        case "office_unavailable":
        case "error": {
            if (data.requestId) {
                pendingRequests.delete(data.requestId);
            } else if (data.type === "office_unavailable") {
                pendingRequests.clear();
            }
            typingIndicator.hidden =
                pendingRequests.size === 0;
            addMessage(
                "assistant",
                String(
                    data.message ||
                        (data.type === "office_unavailable"
                            ? "The office application is unavailable."
                            : "The server could not process the request.")
                )
            );
            break;
        }

        case "delivery_status":
            console.info("Office delivery status:", data);
            break;

        default:
            console.info("Unhandled server message:", data);
            break;
    }
}

/* =========================================
   DEMO MODE
========================================= */

function showDemoResponse(message) {
    typingIndicator.hidden = false;
    scrollToBottom();

    window.setTimeout(() => {
        typingIndicator.hidden = true;
        addMessage(
            "assistant",
            "This is a local interface preview.\n\n" +
                "Your message was received by the browser:\n\n" +
                message +
                "\n\nThe Cloudflare messaging server and office VB.NET AI connection have not been configured yet."
        );
    }, 700);
}

/* =========================================
   MULTILINGUAL VOICE INPUT
========================================= */

let mediaRecorder = null;
let voiceStream = null;
let voiceChunks = [];
let voiceStopping = false;
let maximumRecordingTimer = null;
let voiceStartedAt = 0;
let speechRecognition = null;
let voiceOriginalInput = "";
let voiceFinalTranscript = "";
let voiceInterimTranscript = "";
let voiceWasCancelled = false;


const VOICE_SETTINGS = {
    maximumRecordingMs: 60000,
    minimumAudioBytes: 4000,
    minimumRecordingMs: 500
};

/* =========================================
   AUDIO MIME / FILE EXTENSION
========================================= */

// IMPORTANT: Groq's Whisper endpoint accepts m4a, but NOT mp4.
// iOS Safari produces AAC-in-MP4 blobs typed as "audio/mp4"; those
// must be relabelled .m4a on the way out. Never silently fall back
// to .webm — that is how an iOS blob ends up rejected by Groq.
const MIME_TO_EXTENSION = {
    "audio/webm": "webm",
    "audio/mp4": "m4a",
    "audio/m4a": "m4a",
    "audio/x-m4a": "m4a",
    "audio/mp3": "mp3",
    "audio/mpeg": "mp3",
    "audio/mpga": "mpga",
    "audio/wav": "wav",
    "audio/x-wav": "wav",
    "audio/ogg": "ogg",
    "audio/flac": "flac"
};

function getAudioFileExtension(mimeType) {
    const mime = String(mimeType || "")
        .toLowerCase()
        .split(";")[0]
        .trim();

    return MIME_TO_EXTENSION[mime] || null;
}

/* =========================================
   LIVE SPEECH-TO-TEXT PREVIEW
========================================= */

function getSpeechRecognitionLanguage() {
    const selected = voiceLanguage.value;
    const localeByLanguage = {
        en: "en-US",
        ml: "ml-IN",
        ar: "ar-SA",
        hi: "hi-IN"
    };

    return localeByLanguage[selected] ||
        (navigator.language || "en-US");
}

function startLiveSpeechPreview() {
    const Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!Recognition) {
        inputStatus.textContent =
            "Recording — live text preview is not supported in this browser";
        return;
    }

    try {
        speechRecognition = new Recognition();
        speechRecognition.lang = getSpeechRecognitionLanguage();
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;
        speechRecognition.maxAlternatives = 1;

        speechRecognition.onresult = function (event) {
            let interim = "";

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const result = event.results[i];
                const phrase = result[0] && result[0].transcript
                    ? result[0].transcript
                    : "";

                if (result.isFinal) {
                    voiceFinalTranscript += phrase;
                } else {
                    interim += phrase;
                }
            }

            voiceInterimTranscript = interim;
            const liveText =
                voiceOriginalInput +
                (voiceOriginalInput && (voiceFinalTranscript || interim) ? " " : "") +
                voiceFinalTranscript +
                voiceInterimTranscript;

            messageInput.value = liveText;
            updateInputHeight();
            messageInput.setSelectionRange(liveText.length, liveText.length);
        };

        speechRecognition.onerror = function (event) {
            console.warn("Live speech recognition:", event.error);
            if (event.error === "not-allowed" || event.error === "service-not-allowed") {
                inputStatus.textContent =
                    "Recording — allow speech recognition permission to show live text";
            }
        };

        speechRecognition.onend = function () {
            // The media recording remains active until the user stops or cancels it.
            if (mediaRecorder && mediaRecorder.state === "recording" && !voiceWasCancelled) {
                inputStatus.textContent =
                    "Recording — live preview paused; tap microphone to finish";
            }
        };

        speechRecognition.start();
    } catch (error) {
        console.warn("Could not start live speech preview:", error);
    }
}

function stopLiveSpeechPreview(cancelled) {
    if (speechRecognition) {
        try {
            if (cancelled && typeof speechRecognition.abort === "function") {
                speechRecognition.abort();
            } else {
                speechRecognition.stop();
            }
        } catch (error) {
            console.warn("Could not stop speech recognition:", error);
        }
        speechRecognition = null;
    }
}

function cancelVoiceRecording() {
    if (!mediaRecorder || mediaRecorder.state !== "recording") return;

    voiceWasCancelled = true;
    stopLiveSpeechPreview(true);
    stopVoiceRecording(false);
    messageInput.value = voiceOriginalInput;
    updateInputHeight();
    cancelRecordingButton.classList.remove("visible");
    showToast("Recording cancelled. Audio and recognized speech discarded.");
}

/* =========================================
   START RECORDING
========================================= */

async function startVoiceRecording() {
    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia ||
        !window.MediaRecorder
    ) {
        showToast(
            "Audio recording is not supported. Use a modern browser over HTTPS."
        );
        return;
    }

    if (voiceStopping || mediaRecorder) return;
    if (micButton.disabled) return;

    try {
        voiceStream =
            await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });

        voiceChunks = [];
        voiceStopping = false;
        voiceStartedAt = Date.now();
        voiceOriginalInput = messageInput.value;
        voiceFinalTranscript = "";
        voiceInterimTranscript = "";
        voiceWasCancelled = false;

        let mimeType = "";

        // Prefer Opus/WebM on Chromium & Android; fall back to MP4
        // on Safari/iOS. The Worker maps MP4 -> M4A on the wire.
        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {
            mimeType = "audio/webm;codecs=opus";
        } else if (
            MediaRecorder.isTypeSupported("audio/mp4")
        ) {
            mimeType = "audio/mp4";
        } else if (
            MediaRecorder.isTypeSupported(
                "audio/ogg;codecs=opus"
            )
        ) {
            mimeType = "audio/ogg;codecs=opus";
        } else if (
            MediaRecorder.isTypeSupported("audio/m4a")
        ) {
            mimeType = "audio/m4a";
        }

        mediaRecorder = mimeType
            ? new MediaRecorder(voiceStream, {
                  mimeType
              })
            : new MediaRecorder(voiceStream);

        mediaRecorder.ondataavailable = function (event) {
            if (event.data && event.data.size > 0) {
                voiceChunks.push(event.data);
            }
        };

        mediaRecorder.onerror = function (event) {
            console.error(
                "MediaRecorder error:",
                event.error || event
            );
            showToast("Microphone recording failed.");
            stopVoiceRecording(false);
        };

        mediaRecorder.onstop = async function () {
            if (voiceWasCancelled) {
                cleanupVoiceCapture();
                return;
            }

            // Do NOT read mediaRecorder.mimeType here — cleanup has
            // already run by the time this fires on some browsers.
            // Capture the type before cleanup.
            const recordedType =
                mediaRecorder && mediaRecorder.mimeType
                    ? mediaRecorder.mimeType
                    : "";

            const audioBlob = new Blob(voiceChunks, {
                type: recordedType || "application/octet-stream"
            });

            const recordingDuration =
                Date.now() - voiceStartedAt;

            cleanupVoiceCapture();

            if (
                recordingDuration <
                VOICE_SETTINGS.minimumRecordingMs
            ) {
                showToast(
                    "Recording was too short. Please try again."
                );
                return;
            }

            if (
                audioBlob.size <
                VOICE_SETTINGS.minimumAudioBytes
            ) {
                showToast(
                    "No clear audio was captured. Please try again."
                );
                return;
            }

            await transcribeAndSend(audioBlob);
        };

        mediaRecorder.start(250);
        startLiveSpeechPreview();
        cancelRecordingButton.classList.add("visible");

        micButton.classList.add("recording");
        micButton.title = "Stop voice recording";
        micButton.setAttribute(
            "aria-label",
            "Stop voice recording"
        );

        inputStatus.textContent =
            "Recording — speech appears here; tap microphone to finish or Cancel to discard";

        showToast(
            "Recording started. Tap the microphone again when finished."
        );

        maximumRecordingTimer = window.setTimeout(function () {
            if (
                mediaRecorder &&
                mediaRecorder.state === "recording"
            ) {
                showToast("Maximum recording time reached.");
                stopVoiceRecording(true);
            }
        }, VOICE_SETTINGS.maximumRecordingMs);
    } catch (error) {
        console.error(
            "Could not start microphone:",
            error
        );
        cleanupVoiceCapture();
        showToast(
            error && error.name === "NotAllowedError"
                ? "Microphone permission was denied. Allow microphone access in your browser."
                : "Unable to start microphone. Check browser permissions and try again."
        );
    }
}

/* =========================================
   STOP RECORDING
========================================= */

function stopVoiceRecording(shouldTranscribe) {
    if (!mediaRecorder) {
        cleanupVoiceCapture();
        return;
    }

    if (mediaRecorder.state === "inactive") {
        cleanupVoiceCapture();
        return;
    }

    voiceStopping = true;

    if (shouldTranscribe) {
        stopLiveSpeechPreview(false);
    }

    if (maximumRecordingTimer) {
        clearTimeout(maximumRecordingTimer);
        maximumRecordingTimer = null;
    }

    if (!shouldTranscribe) {
        stopLiveSpeechPreview(true);
        voiceChunks = [];
        mediaRecorder.onstop = function () {
            cleanupVoiceCapture();
        };
    }

    try {
        mediaRecorder.stop();
        inputStatus.textContent = shouldTranscribe
            ? "Preparing audio..."
            : "Recording cancelled";
    } catch (error) {
        console.error(
            "Could not stop voice recording:",
            error
        );
        cleanupVoiceCapture();
    }
}

/* =========================================
   CLEANUP MICROPHONE RESOURCES
========================================= */

function cleanupVoiceCapture() {
    if (maximumRecordingTimer) {
        clearTimeout(maximumRecordingTimer);
        maximumRecordingTimer = null;
    }

    if (voiceStream) {
        voiceStream.getTracks().forEach((track) => track.stop());
        voiceStream = null;
    }

    mediaRecorder = null;
    voiceChunks = [];
    voiceStopping = false;
    cancelRecordingButton.classList.remove("visible");

    micButton.classList.remove("recording");
    micButton.title = "Start voice recording";
    micButton.setAttribute(
        "aria-label",
        "Start voice recording"
    );

    inputStatus.textContent =
        "Text and multilingual voice supported";
}

/* =========================================
   TRANSCRIBE AUDIO THROUGH CLOUDFLARE
========================================= */

async function transcribeAndSend(audioBlob) {
    if (!CONFIG.transcriptionUrl) {
        showToast(
            "Transcription URL is missing from CONFIG."
        );
        return;
    }

    if (!hasConfiguredToken()) {
        showToast(
            "Configure your mobile token before using voice input."
        );
        return;
    }

    if (!audioBlob || audioBlob.size === 0) {
        showToast("No audio data was recorded.");
        return;
    }

    // Resolve the extension we will send to the Worker. If the blob
    // type is missing (iOS Safari), use the container the recorder
    // actually produced, not a blind "webm" default.
    let extension = getAudioFileExtension(audioBlob.type);

    if (!extension) {
        // If the blob is empty-typed (Safari), infer from the
        // underlying MediaRecorder mimetype captured at stop time.
        if (
            mediaRecorder &&
            mediaRecorder.mimeType
        ) {
            extension = getAudioFileExtension(
                mediaRecorder.mimeType
            );
        }
    }

    if (!extension) {
        // Absolute last resort — let the Worker sniff the bytes
        // and return a proper 415 with a readable error.
        extension = "webm";
        console.warn(
            "Unknown blob type, defaulting to .webm:",
            audioBlob.type
        );
    }

    inputStatus.textContent =
        "Detecting language and transcribing...";

    micButton.disabled = true;
    voiceLanguage.disabled = true;

    try {
        const formData = new FormData();

        const selectedLanguage = voiceLanguage.value;
        if (selectedLanguage) {
            formData.append("language", selectedLanguage);
        }

        // Cloudflare Worker expects multipart field "file".
        formData.append(
            "file",
            audioBlob,
            "voice." + extension
        );

        const response = await fetch(
            CONFIG.transcriptionUrl,
            {
                method: "POST",
                headers: {
                    "X-Mobile-Token": CONFIG.mobileToken
                },
                body: formData
            }
        );

        const result = await response
            .json()
            .catch(() => ({}));

        if (!response.ok) {
            // Prefer the provider's detailed message if the Worker
            // forwarded it, then fall back to the generic error.
            const detail =
                (result && result.details) ||
                (result && result.error) ||
                result?.message;

            throw new Error(
                detail ||
                    "Transcription service returned HTTP " +
                        response.status
            );
        }

        if (!result.success) {
            throw new Error(
                result.error ||
                    "Transcription was unsuccessful."
            );
        }

        const transcript =
            String(result.text || "").trim();

        if (!transcript) {
            throw new Error(
                "No speech could be recognized. Please try again."
            );
        }

        messageInput.value = transcript;
        updateInputHeight();

        if (result.language) {
            console.info(
                "Detected speech language:",
                result.language
            );
        }

        // If the WebSocket is offline, keep the transcript in the
        // box so the user can send it manually once reconnected.
        if (
            !socket ||
            socket.readyState !== WebSocket.OPEN ||
            !isAuthenticated ||
            !officeOnline
        ) {
            showToast(
                "Transcript ready — connection is offline. Send when reconnected."
            );
            return;
        }

        sendMessage();
    } catch (error) {
        console.error(
            "Voice transcription failed:",
            error
        );
        showToast(
            error.message ||
                "Voice transcription failed. Please try again."
        );
    } finally {
        micButton.disabled = false;
        voiceLanguage.disabled = false;
        inputStatus.textContent =
            "Text and multilingual voice supported";
    }
}

/* =========================================
   MICROPHONE BUTTON
========================================= */

micButton.addEventListener("click", function () {
    if (
        mediaRecorder &&
        mediaRecorder.state === "recording"
    ) {
        stopVoiceRecording(true);
    } else if (!mediaRecorder) {
        startVoiceRecording();
    }
});

cancelRecordingButton.addEventListener("click", cancelVoiceRecording);

/* =========================================
   BUTTON EVENTS
========================================= */

sendButton.addEventListener("click", sendMessage);

messageInput.addEventListener(
    "keydown",
    function (event) {
        if (
            event.key === "Enter" &&
            !event.shiftKey &&
            !event.isComposing
        ) {
            event.preventDefault();
            sendMessage();
        }
    }
);

messageInput.addEventListener("input", updateInputHeight);

/* =========================================
   SUGGESTION BUTTONS
========================================= */

document
    .querySelectorAll(".suggestion")
    .forEach((button) => {
        button.addEventListener("click", function () {
            messageInput.value = this.dataset.message || "";
            updateInputHeight();
            sendMessage();
        });
    });

/* =========================================
   CLEAR CHAT
========================================= */

document
    .getElementById("clearButton")
    .addEventListener("click", function () {
        if (!confirm("Clear this conversation?")) return;
        messages.replaceChildren();
        welcome.style.display = "block";
        typingIndicator.hidden = true;
        pendingRequests.clear();
        messageInput.value = "";
        messageInput.style.height = "auto";
        showToast("Conversation cleared");
    });

/* =========================================
   PAGE INITIALIZATION
========================================= */

function initializeApp() {
    if (CONFIG.demoMode) {
        setConnectionStatus(false, "Local preview mode");
        return;
    }
    connectBackend();
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeApp);
} else {
    initializeApp();
}

/* =========================================
   CLEANUP WHEN PAGE IS CLOSED
========================================= */

window.addEventListener("pagehide", function () {
    if (
        mediaRecorder &&
        mediaRecorder.state === "recording"
    ) {
        stopVoiceRecording(false);
    }

    if (voiceStream) {
        voiceStream.getTracks().forEach((track) => track.stop());
    }

    if (socket && socket.readyState === WebSocket.OPEN) {
        socket.close();
    }
});

/* =========================================
   PREVENT MOBILE PAGE ZOOM
========================================= */

document.addEventListener(
    "gesturestart",
    function (event) {
        event.preventDefault();
    },
    { passive: false }
);

document.addEventListener(
    "gesturechange",
    function (event) {
        event.preventDefault();
    },
    { passive: false }
);

document.addEventListener(
    "gestureend",
    function (event) {
        event.preventDefault();
    },
    { passive: false }
);

let lastTouchEnd = 0;

document.addEventListener(
    "touchend",
    function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    },
    { passive: false }
);
</script>
