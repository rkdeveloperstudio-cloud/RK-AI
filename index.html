
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<link rel="manifest" href="./manifest.json">
<meta name="description" content="RK AI Mobile Business Assistant">

<title>RK AI Mobile Assistant</title>

<style>
/* =========================================
   RK AI MOBILE ASSISTANT
   SINGLE FILE: HTML + CSS + JAVASCRIPT
========================================= */

:root {
    --bg: #101827;
    --panel: #172235;
    --panel2: #202e43;
    --border: #293950;
    --text: #edf3fb;
    --muted: #94a3b8;
    --primary: #5688f5;
    --primary-hover: #3972ed;
    --success: #22c58b;
    --danger: #f87171;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
}

button, textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 950px;
    height: 100%;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
}

/* HEADER */

.header {
    min-height: 76px;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 46px;
    height: 46px;
    background: var(--primary);
    border-radius: 14px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 19px;
    font-weight: 800;
    color: white;
}

.brand h1 {
    font-size: 17px;
    font-weight: 650;
}

.connection {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    background: var(--danger);
}

.dot.online {
    background: var(--success);
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-button {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel2);
    color: var(--text);
    font-size: 19px;
}

/* CHAT AREA */

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 18px;
    scroll-behavior: smooth;
}

.welcome {
    max-width: 520px;
    margin: 50px auto 30px;
    text-align: center;
}

.welcome-logo {
    width: 70px;
    height: 70px;
    border-radius: 20px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: auto auto 20px;
    font-size: 25px;
    font-weight: 800;
}

.welcome h2 {
    font-size: 24px;
    margin-bottom: 12px;
}

.welcome p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 25px;
}

.suggestion {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 10px;
    color: var(--text);
    font-size: 13px;
    text-align: left;
}

.suggestion:hover {
    border-color: var(--primary);
    background: var(--panel2);
}

/* MESSAGES */

.message-row {
    display: flex;
    margin-bottom: 20px;
}

.message-row.user {
    justify-content: flex-end;
}

.message-row.assistant {
    justify-content: flex-start;
}

.message-bubble {
    max-width: 85%;
    padding: 14px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.65;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.user .message-bubble {
    background: var(--primary);
    color: white;
    border-bottom-right-radius: 4px;
}

.assistant .message-bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
}

.message-time {
    display: block;
    margin-top: 7px;
    font-size: 10px;
    opacity: 0.65;
    text-align: right;
}

.message-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 5px;
}

.typing {
    color: var(--muted);
    font-size: 13px;
    padding: 12px;
}

/* INPUT */

.input-section {
    padding: 14px 16px 10px;
    background: var(--panel);
    border-top: 1px solid var(--border);
}

.input-container {
    display: flex;
    align-items: flex-end;
    gap: 9px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px;
}

.input-container textarea {
    flex: 1;
    min-width: 0;
    max-height: 130px;
    resize: none;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    padding: 10px 7px;
    font-size: 14px;
    line-height: 1.5;
}

.input-container textarea::placeholder {
    color: var(--muted);
}

.send-button,
.mic-button {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    border: none;
    border-radius: 12px;
    font-size: 19px;
}

.send-button {
    background: var(--primary);
    color: white;
}

.send-button:hover {
    background: var(--primary-hover);
}

.mic-button {
    background: transparent;
    color: var(--text);
}

.mic-button.recording {
    background: var(--danger);
    color: white;
    animation: pulse 1s infinite;
}

button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

@keyframes pulse {
    50% { opacity: 0.55; }
}

.input-footer {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    color: var(--muted);
    font-size: 10px;
}

/* NOTIFICATION */

.toast {
    position: fixed;
    left: 50%;
    bottom: 95px;
    transform: translateX(-50%);
    background: #26374e;
    color: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 13px;
    display: none;
    z-index: 10;
    max-width: 90%;
    text-align: center;
}

.toast.show {
    display: block;
}

/* MOBILE */

@media (max-width: 600px) {

    .header {
        min-height: 68px;
        padding: 10px 13px;
    }

    .brand h1 {
        font-size: 15px;
    }

    .chat-area {
        padding: 18px 12px;
    }

    .welcome {
        margin-top: 35px;
    }

    .welcome h2 {
        font-size: 21px;
    }

    .suggestions {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .suggestion {
        font-size: 12px;
        padding: 12px 9px;
    }

    .message-bubble {
        max-width: 90%;
        font-size: 14px;
    }

    .input-section {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="brand">

            <div class="logo">RK</div>

            <div>
                <h1>RK AI Assistant</h1>

                <div class="connection" id="connectionStatus">
                    <span class="dot"></span>
                    Backend not connected
                </div>
            </div>

        </div>

        <div class="header-actions">

            <button class="icon-button"
                    id="clearButton"
                    title="Clear chat">
                ↻
            </button>

        </div>

    </header>


    <!-- CHAT -->
    <main class="chat-area" id="chatArea">

        <section class="welcome" id="welcome">

            <div class="welcome-logo">RK</div>

            <h2>Welcome to RK AI</h2>

            <p>
                Your mobile business assistant.

                Ask questions about sales, purchases,
                inventory, suppliers and customers.
            </p>

            <div class="suggestions">

                <button class="suggestion"
                    data-message="Check my today's total sales">
                    Today's total sales
                </button>

                <button class="suggestion"
                    data-message="Show my current stock summary">
                    Current stock summary
                </button>

                <button class="suggestion"
                    data-message="Show my top selling products">
                    Top selling products
                </button>

                <button class="suggestion"
                    data-message="Show my purchase summary">
                    Purchase summary
                </button>

            </div>

        </section>

        <div id="messages"></div>

        <div id="typingIndicator"
             class="typing"
             hidden>
            RK AI is processing...
        </div>

    </main>


    <!-- MESSAGE INPUT -->
    <footer class="input-section">

        <div class="input-container">

            <textarea
                id="messageInput"
                placeholder="Ask your business assistant..."
                rows="1"
                maxlength="4000">
            </textarea>

            <button class="mic-button"
                    id="micButton"
                    title="Voice input">
                🎤
            </button>

            <button class="send-button"
                    id="sendButton"
                    title="Send message">
                ➤
            </button>

        </div>

        <div class="input-footer">

            <span id="inputStatus">
                Text and voice supported
            </span>

            <span>RK Developer Studio</span>

        </div>

    </footer>

</div>

<div class="toast" id="toast"></div>


<script>
/* =========================================
   RK AI MOBILE ASSISTANT
   JAVASCRIPT
========================================= */

/*
    BACKEND CONFIGURATION

    Leave empty while testing the interface.

    Later, we will add your Cloudflare Worker
    WebSocket URL here.

    Example format:
    wss://your-worker.your-subdomain.workers.dev/ws

    Never put SQL credentials or AI provider
    API keys in this file.
*/

const CONFIG = {
    // Replace this with your deployed Cloudflare Worker WebSocket URL.
    // Example: "wss://YOUR-WORKER.YOUR-SUBDOMAIN.workers.dev/ws"
    websocketUrl: "wss://rkai-mobile-assistant.rkdeveloperstudio.workers.dev/ws",

    // DEVELOPMENT ONLY. Keep your existing test token here locally.
    // Do not publish this file with a permanent token inside it.
    mobileToken: "PASTE_YOUR_EXISTING_MOBILE_TOKEN_HERE",

    // This route must be added to the Cloudflare Worker before voice
    // transcription can work. It must accept multipart/form-data field "audio"
    // and return JSON: { "text": "recognized words", "language": "ml" }.
    transcriptionUrl: "https://rkai-mobile-assistant.rkdeveloperstudio.workers.dev/api/transcribe",

    demoMode: false
};


/* =========================================
   ELEMENTS
========================================= */

const chatArea = document.getElementById("chatArea");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const micButton = document.getElementById("micButton");

const connectionStatus =
    document.getElementById("connectionStatus");

const inputStatus =
    document.getElementById("inputStatus");

const typingIndicator =
    document.getElementById("typingIndicator");

const toast = document.getElementById("toast");

let socket = null;
let recognition = null;
let pendingRequests = new Map();
let isAuthenticated = false;
let officeOnline = false;
let authenticationFailed = false;


/* =========================================
   UTILITY FUNCTIONS
========================================= */

function showToast(message) {

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}


function getTime() {

    return new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

}


function scrollToBottom() {

    chatArea.scrollTop = chatArea.scrollHeight;

}


function createRequestId() {

    if (window.crypto &&
        typeof window.crypto.randomUUID === "function") {

        return window.crypto.randomUUID();

    }

    return "req-" + Date.now() +
        "-" + Math.random().toString(16).slice(2);

}


/* =========================================
   CONNECTION STATUS
========================================= */

function setConnectionStatus(online, message) {

    connectionStatus.replaceChildren();

    const dot = document.createElement("span");

    dot.className = online
        ? "dot online"
        : "dot";

    connectionStatus.appendChild(dot);

    connectionStatus.appendChild(
        document.createTextNode(message)
    );

}


/* =========================================
   MESSAGE DISPLAY
========================================= */

function addMessage(type, text) {

    welcome.style.display = "none";

    const row = document.createElement("div");

    row.className = "message-row " + type;

    const bubble = document.createElement("div");

    bubble.className = "message-bubble";

    const label = document.createElement("div");

    label.className = "message-label";

    label.textContent =
        type === "user" ? "You" : "RK AI";

    const content = document.createElement("div");

    /*
        textContent prevents HTML injection.
        AI responses are displayed as plain text
        until we implement structured responses.
    */

    content.textContent = text;

    const time = document.createElement("span");

    time.className = "message-time";
    time.textContent = getTime();

    bubble.appendChild(label);
    bubble.appendChild(content);
    bubble.appendChild(time);

    row.appendChild(bubble);

    messages.appendChild(row);

    scrollToBottom();

    return row;
}


/* =========================================
   SEND MESSAGE
========================================= */

function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) {
        return;
    }

    addMessage("user", message);

    messageInput.value = "";
    messageInput.style.height = "auto";

    if (CONFIG.demoMode) {

        showDemoResponse(message);

        return;
    }

    if (!socket ||
        socket.readyState !== WebSocket.OPEN) {

        addMessage(
            "assistant",
            "The messaging server is not connected. Please try again when the connection is available."
        );

        return;
    }

    sendToBackend(message);

}


/* =========================================
   BACKEND MESSAGE
========================================= */

function sendToBackend(message) {

    if (!socket || socket.readyState !== WebSocket.OPEN || !isAuthenticated) {
        addMessage("assistant", "The mobile connection is not authenticated yet. Please wait for the connection and try again.");
        return;
    }

    if (!officeOnline) {
        addMessage("assistant", "The office application is currently offline. Open RK AI Business Assistant on the office PC and wait until it connects.");
        return;
    }

    const requestId = createRequestId();

    const payload = {
        type: "user_message",
        requestId: requestId,
        conversationId: "mobile-default",
        message: message,
        timestamp: new Date().toISOString()
    };

    try {
        // Register before sending so a very fast response cannot arrive first.
        pendingRequests.set(requestId, {
            message: message,
            time: Date.now()
        });

        socket.send(JSON.stringify(payload));
        typingIndicator.hidden = false;
        scrollToBottom();

        setTimeout(() => {
            if (pendingRequests.has(requestId)) {
                pendingRequests.delete(requestId);
                typingIndicator.hidden = pendingRequests.size === 0;
                addMessage("assistant", "The office assistant has not responded yet. Check the desktop connection and try again.");
            }
        }, 60000);

    }
    catch (error) {
        pendingRequests.delete(requestId);
        typingIndicator.hidden = pendingRequests.size === 0;
        addMessage("assistant", "Unable to send your message. Please reconnect and try again.");
        console.error("Send message failed:", error);
    }
}


/* =========================================
   WEBSOCKET CONNECTION
========================================= */

function connectBackend() {

    if (!CONFIG.websocketUrl || CONFIG.websocketUrl.includes("YOUR-WORKER")) {
        setConnectionStatus(false, "Set Worker URL in CONFIG");
        return;
    }

    if (!CONFIG.mobileToken || CONFIG.mobileToken === "PASTE_YOUR_MOBILE_TOKEN_HERE") {
        setConnectionStatus(false, "Set mobile token in CONFIG");
        return;
    }

    try {
        authenticationFailed = false;
        isAuthenticated = false;
        officeOnline = false;
        setConnectionStatus(false, "Connecting...");

        socket = new WebSocket(CONFIG.websocketUrl);

        socket.onopen = function () {
            // A successful WebSocket handshake is NOT authentication.
            // The Worker expects this exact authentication message.
            socket.send(JSON.stringify({
                type: "authenticate",
                role: "mobile",
                token: CONFIG.mobileToken
            }));
            setConnectionStatus(false, "Authenticating...");
        };

        socket.onmessage = function (event) {
            try {
                const data = JSON.parse(event.data);
                handleBackendMessage(data);
            }
            catch (error) {
                console.error("Invalid server response:", error);
            }
        };

        socket.onerror = function (error) {
            console.error("WebSocket error:", error);
        };

        socket.onclose = function () {
            isAuthenticated = false;
            officeOnline = false;
            setConnectionStatus(false, "Disconnected");
            typingIndicator.hidden = true;
            pendingRequests.clear();

            // Do not loop forever when the Worker rejected the configured token.
            if (CONFIG.websocketUrl && !authenticationFailed) {
                setTimeout(connectBackend, 5000);
            }
        };

    }
    catch (error) {
        console.error("Connection failed:", error);
        setConnectionStatus(false, "Connection failed");
    }
}


/* =========================================
   RECEIVE BACKEND RESPONSE
========================================= */

function handleBackendMessage(data) {

    if (!data || typeof data.type !== "string") return;

    switch (data.type) {

        case "authenticated":
            if (data.role !== "mobile") {
                authenticationFailed = true;
                setConnectionStatus(false, "Unexpected authentication role");
                socket?.close();
                return;
            }
            isAuthenticated = true;
            setConnectionStatus(false, "Authenticated · checking office...");
            showToast("Mobile authenticated with RK AI server");
            break;

        case "authentication_failed":
            authenticationFailed = true;
            isAuthenticated = false;
            officeOnline = false;
            setConnectionStatus(false, "Authentication failed — check token");
            showToast("Mobile token rejected by server");
            if (socket && socket.readyState === WebSocket.OPEN) socket.close();
            break;

        case "office_status":
            officeOnline = Boolean(data.online);
            if (isAuthenticated) {
                setConnectionStatus(officeOnline, officeOnline
                    ? "Connected · office online"
                    : "Connected · office offline");
            }
            break;

        case "message_received":
            // The Worker accepted and forwarded the request; the AI answer follows separately.
            if (data.message) console.info("Worker:", data.message);
            break;

        case "assistant_response": {
            const requestId = data.requestId;
            if (requestId && pendingRequests.has(requestId)) {
                pendingRequests.delete(requestId);
                typingIndicator.hidden = pendingRequests.size === 0;
                addMessage("assistant", String(data.message || ""));
            }
            break;
        }

        case "assistant_error":
        case "office_unavailable":
        case "error": {
            if (data.requestId) pendingRequests.delete(data.requestId);
            else if (data.type === "office_unavailable") pendingRequests.clear();
            typingIndicator.hidden = pendingRequests.size === 0;
            addMessage("assistant", String(data.message ||
                (data.type === "office_unavailable"
                    ? "The office application is unavailable."
                    : "The server could not process the request.")));
            break;
        }

        case "delivery_status":
            // Delivery acknowledgement only; the assistant_response carries the answer.
            console.info("Office delivery status:", data);
            break;

        default:
            console.info("Unhandled server message:", data);
            break;
    }
}


/* =========================================
   DEMO MODE
   LOCAL INTERFACE TESTING ONLY
========================================= */

function showDemoResponse(message) {

    typingIndicator.hidden = false;

    scrollToBottom();

    setTimeout(() => {

        typingIndicator.hidden = true;

        addMessage(
            "assistant",
            "This is a local interface preview.\n\n" +
            "Your message was received by the browser:\n\n" +
            message +
            "\n\nThe Cloudflare messaging server and office VB.NET AI connection have not been configured yet."
        );

    }, 700);

}


/* =========================================
   MULTILINGUAL VOICE INPUT
   Audio is sent to the Worker transcription endpoint.
   The transcription service must detect the spoken language automatically.
========================================= */

let mediaRecorder = null;
let voiceStream = null;
let voiceChunks = [];
let audioContext = null;
let analyser = null;
let silenceCheckTimer = null;
let speechStarted = false;
let lastSoundAt = 0;
let voiceStopping = false;

const VOICE_SETTINGS = {
    silenceDurationMs: 1600,
    speechThreshold: 0.018,
    minimumRecordingMs: 500,
    maximumRecordingMs: 60000
};

let voiceStartedAt = 0;
let maximumRecordingTimer = null;

function updateInputHeight() {
    messageInput.style.height = "auto";
    messageInput.style.height = Math.min(messageInput.scrollHeight, 130) + "px";
}

async function startVoiceRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        showToast("Audio recording is not supported in this browser. Please use a modern browser over HTTPS.");
        return;
    }

    if (voiceStopping || mediaRecorder) return;

    try {
        voiceStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            }
        });

        voiceChunks = [];
        speechStarted = false;
        voiceStopping = false;
        voiceStartedAt = Date.now();
        lastSoundAt = 0;

        const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
            ? "audio/webm;codecs=opus"
            : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "");

        mediaRecorder = mimeType
            ? new MediaRecorder(voiceStream, { mimeType })
            : new MediaRecorder(voiceStream);

        mediaRecorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) voiceChunks.push(event.data);
        };

        mediaRecorder.onerror = event => {
            console.error("MediaRecorder error:", event.error || event);
            showToast("Microphone recording failed.");
            stopVoiceRecording(false);
        };

        mediaRecorder.onstop = async () => {
            const recordedType = mediaRecorder ? mediaRecorder.mimeType : "audio/webm";
            const audioBlob = new Blob(voiceChunks, { type: recordedType || "audio/webm" });
            cleanupVoiceCapture();

            if (audioBlob.size < 1500) {
                showToast("No clear speech was detected. Please try again.");
                return;
            }

            await transcribeAndSend(audioBlob);
        };

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(voiceStream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        mediaRecorder.start(250);
        micButton.classList.add("recording");
        micButton.title = "Stop voice recording";
        inputStatus.textContent = "Listening — speak now...";
        showToast("Speak naturally. Your voice will send after you stop speaking.");

        const samples = new Uint8Array(analyser.fftSize);
        silenceCheckTimer = window.setInterval(() => {
            if (!mediaRecorder || mediaRecorder.state !== "recording" || !analyser) return;

            analyser.getByteTimeDomainData(samples);
            let sum = 0;
            for (let i = 0; i < samples.length; i++) {
                const normalized = (samples[i] - 128) / 128;
                sum += normalized * normalized;
            }
            const rms = Math.sqrt(sum / samples.length);
            const now = Date.now();

            if (rms >= VOICE_SETTINGS.speechThreshold) {
                speechStarted = true;
                lastSoundAt = now;
                inputStatus.textContent = "Speech detected...";
            }

            if (speechStarted && now - lastSoundAt >= VOICE_SETTINGS.silenceDurationMs) {
                stopVoiceRecording(true);
            }
        }, 150);

        maximumRecordingTimer = window.setTimeout(() => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                stopVoiceRecording(true);
            }
        }, VOICE_SETTINGS.maximumRecordingMs);

    } catch (error) {
        console.error("Could not start microphone:", error);
        cleanupVoiceCapture();
        showToast(error && error.name === "NotAllowedError"
            ? "Microphone permission was denied. Allow microphone access in your browser."
            : "Unable to start microphone. Check browser permissions and try again.");
    }
}

function stopVoiceRecording(shouldTranscribe) {
    if (!mediaRecorder || mediaRecorder.state === "inactive") return;
    voiceStopping = true;
    if (silenceCheckTimer) {
        clearInterval(silenceCheckTimer);
        silenceCheckTimer = null;
    }
    if (maximumRecordingTimer) {
        clearTimeout(maximumRecordingTimer);
        maximumRecordingTimer = null;
    }
    if (!shouldTranscribe) {
        voiceChunks = [];
        mediaRecorder.onstop = () => cleanupVoiceCapture();
    }
    try {
        mediaRecorder.stop();
    } catch (error) {
        console.error("Could not stop voice recording:", error);
        cleanupVoiceCapture();
    }
}

function cleanupVoiceCapture() {
    if (silenceCheckTimer) clearInterval(silenceCheckTimer);
    if (maximumRecordingTimer) clearTimeout(maximumRecordingTimer);
    silenceCheckTimer = null;
    maximumRecordingTimer = null;

    if (voiceStream) {
        voiceStream.getTracks().forEach(track => track.stop());
        voiceStream = null;
    }
    if (audioContext) {
        audioContext.close().catch(() => {});
        audioContext = null;
    }

    mediaRecorder = null;
    analyser = null;
    voiceStopping = false;
    micButton.classList.remove("recording");
    micButton.title = "Voice input";
    inputStatus.textContent = "Text and multilingual voice supported";
}

async function transcribeAndSend(audioBlob) {
    if (!CONFIG.transcriptionUrl || !CONFIG.mobileToken ||
        CONFIG.mobileToken === "PASTE_YOUR_EXISTING_MOBILE_TOKEN_HERE") {
        showToast("Set the existing test token and transcription endpoint in CONFIG first.");
        return;
    }

    inputStatus.textContent = "Detecting language and transcribing...";
    micButton.disabled = true;

    try {
        const formData = new FormData();
        const extension = audioBlob.type.includes("mp4") ? "m4a" : "webm";
        formData.append("audio", audioBlob, "voice." + extension);

        const response = await fetch(CONFIG.transcriptionUrl, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + CONFIG.mobileToken
            },
            body: formData
        });

        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(result.message || "Transcription service returned HTTP " + response.status);
        }

        const transcript = String(result.text || result.transcript || "").trim();
        if (!transcript) {
            throw new Error("No speech could be recognized. Please try again.");
        }

        // Show the detected transcript, then use the existing text-message flow.
        messageInput.value = transcript;
        updateInputHeight();
        if (result.language) {
            console.info("Detected speech language:", result.language);
        }
        sendMessage();

    } catch (error) {
        console.error("Voice transcription failed:", error);
        showToast(error.message || "Voice transcription failed. Please try again.");
    } finally {
        micButton.disabled = false;
        inputStatus.textContent = "Text and multilingual voice supported";
    }
}

micButton.addEventListener("click", function () {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        stopVoiceRecording(true);
    } else {
        startVoiceRecording();
    }
});

/* =========================================
   BUTTON EVENTS
========================================= */

sendButton.addEventListener("click", sendMessage);


messageInput.addEventListener("keydown", function (event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
    ) {

        event.preventDefault();

        sendMessage();

    }

});


messageInput.addEventListener("input", function () {

    this.style.height = "auto";

    this.style.height =
        Math.min(this.scrollHeight, 130) + "px";

});


/* =========================================
   SUGGESTION BUTTONS
========================================= */

document.querySelectorAll(".suggestion").forEach(button => {

    button.addEventListener("click", function () {

        messageInput.value = this.dataset.message;

        sendMessage();

    });

});


/* =========================================
   CLEAR CHAT
========================================= */

document.getElementById("clearButton")
    .addEventListener("click", function () {

        if (!confirm("Clear this conversation?")) {
            return;
        }

        messages.replaceChildren();

        welcome.style.display = "block";

        typingIndicator.hidden = true;

        pendingRequests.clear();

        messageInput.value = "";

        showToast("Conversation cleared");

    });


/* =========================================
   INITIALIZATION
========================================= */

document.addEventListener("DOMContentLoaded", function () {

    if (CONFIG.demoMode) {
        setConnectionStatus(false, "Local preview mode");
    }
    else {
        connectBackend();
    }

});

</script>
